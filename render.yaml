services:
  - type: web
    name: offertrace-backend
    runtime: python
    plan: free

    buildCommand: pip install -r backend/requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir backend

    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET_KEY
        sync: false

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"